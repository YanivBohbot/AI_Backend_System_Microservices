events {}

http {
    # Service names resolve via the docker-compose `backend` network.
    # Each upstream targets the container's internal (Dockerfile CMD) port.
    upstream user_service { server user-service:8001; }
    upstream ai_service { server ai-service:8002; }
    upstream alert_service { server alert-service:8003; }
    upstream log_service { server log-service:8004; }
    upstream external_api_service { server external-api-service:8005; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /user/  { proxy_pass http://user_service; }
        location /fraud/ { proxy_pass http://ai_service; }
        location /alert/ { proxy_pass http://alert_service; }
        location /logs/  { proxy_pass http://log_service; }
        location /geoip/ { proxy_pass http://external_api_service; }

        location / {
            return 404 '{"detail":"unknown route"}';
            add_header Content-Type application/json;
        }
    }
}
