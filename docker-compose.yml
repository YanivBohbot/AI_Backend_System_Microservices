services:
  user-service:
    build:
      context: ./user_service
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${USER_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - log-service
      - alert-service
    networks:
      - backend

  ai-service:
    build:
      context: ./ai_service
    container_name: ai-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${AI_DATABASE_URL}
    depends_on:
      - user-service
      - log-service
      - alert-service
      - external-api-service
    networks:
      - backend

  external-api-service:
    build:
      context: ./external_apis_services
    container_name: external-api-service
    # Container listens on 8005 (see Dockerfile CMD)
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: ${EXTERNAL_DATABASE_URL}
    networks:
      - backend

  alert-service:
    build:
      context: ./alert_service
    container_name: alert-service
    # Container listens on 8003 (see Dockerfile CMD)
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: ${ALERT_DATABASE_URL}
    networks:
      - backend

  log-service:
    build:
      context: ./log_service
    container_name: log-service
    # Container listens on 8004 (see Dockerfile CMD)
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: ${LOG_DATABASE_URL}
    networks:
      - backend

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - ai-service
      - external-api-service
      - alert-service
      - log-service
    networks:
      - backend

networks:
  backend:
    driver: bridge
